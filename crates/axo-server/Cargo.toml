[package]
name = "axo-server"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
jsonrpc-core = "18.0.0"
jsonrpc-ipc-server = "18.0.0"
libc = "0.2"
log = "0.4"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.30.0", features = ["native-tls", "url"] }
url = "2.5.8"
