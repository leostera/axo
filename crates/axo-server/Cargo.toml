[package]
name = "axo-server"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
axo-panes = { path = "../axo-panes" }
axo-pi = { path = "../axo-pi" }
axo-ipc = { path = "../axo-ipc" }
axo-protocol = { path = "../axo-protocol" }
axo-pty = { path = "../axo-pty" }
axo-relay = { path = "../axo-relay" }
axo-store = { path = "../axo-store" }
jsonrpc-core = "18.0.0"
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2.0.1"

[dev-dependencies]
rusqlite = "0.39.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
