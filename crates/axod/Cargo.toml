[package]
name = "axod"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "axod"
path = "src/main.rs"

[dependencies]
axo-pty = { path = "../axo-pty" }
axo-server = { path = "../axo-server" }
clap = { version = "4.5", features = ["derive", "string"] }
env_logger = "0.11"
libc = "0.2"
log = "0.4"

[dev-dependencies]
serde_json = "1"
