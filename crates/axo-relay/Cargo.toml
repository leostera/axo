[package]
name = "axo-relay"
version = "0.1.0"
edition = "2024"

[dependencies]
axo-protocol = { path = "../axo-protocol" }
httparse = "1.10.1"
native-tls = "0.2.18"
tungstenite = { version = "0.30.0", features = ["native-tls", "url"] }
url = "2.5.8"
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
