# The iPhone app as a native Xcode project, so Xcode manages signing (pick your team under
# Signing & Capabilities). Generate it with `xcodegen generate` in this directory; the result,
# AxoPhone.xcodeproj, is not checked in. Bazel builds the same sources (see BUILD.bazel) and the
# model's tests; this project is for running on a device.
name: AxoPhone
options:
  bundleIdPrefix: dev.leostera
  deploymentTarget:
    iOS: "17.0"
packages:
  AxoClient:
    path: ../AxoClient
  AxoProtocol:
    path: ../AxoProtocol
  AxoPhoneModel:
    path: .
targets:
  AxoPhone:
    type: application
    platform: iOS
    sources:
      - path: Sources/AxoPhone
      - path: Sources/AxoPhoneMain
    dependencies:
      - package: AxoPhoneModel
        product: AxoPhoneModel
      - package: AxoClient
        product: AxoClient
      - package: AxoProtocol
        product: AxoProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leostera.axo.phone
        PRODUCT_NAME: Axo
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: AxoPhone-Xcode.entitlements
        CODE_SIGN_STYLE: Automatic
        # Choose your team in Xcode, or set DEVELOPMENT_TEAM here for everyone.
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
schemes:
  AxoPhone:
    build:
      targets:
        AxoPhone: all
    run:
      config: Debug
