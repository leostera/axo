name: Axo
options:
  bundleIdPrefix: dev.leostera.axo
  deploymentTarget:
    macOS: '26.0'
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    INFOPLIST_KEY_CFBundleShortVersionString: $(MARKETING_VERSION)
    INFOPLIST_KEY_CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    CODE_SIGN_STYLE: Automatic
packages:
  AxoCore:
    path: AxoCore
  AxoProtocol:
    path: ../protocol
  AxoVoice:
    path: AxoVoice
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui.git
    exactVersion: 2.4.1
targets:
  AxoMac:
    type: application
    platform: macOS
    sources:
      - path: AxoMacAxod
        excludes:
          - Info.plist
          - dev.leostera.axo.axod.plist
    dependencies:
      - package: AxoCore
      - package: AxoProtocol
      - sdk: ServiceManagement.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leostera.axo.mac
        PRODUCT_NAME: Axo
        INFOPLIST_FILE: AxoMacAxod/Info.plist
        ENABLE_APP_SANDBOX: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_CFBundleDisplayName: Axo
  AxoPhone:
    type: application
    platform: iOS
    sources: [AxoPhone]
    dependencies:
      - package: AxoCore
      - package: AxoVoice
      - package: MarkdownUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leostera.axo.phone
        DEVELOPMENT_TEAM: RGH6S9S55G
        TARGETED_DEVICE_FAMILY: '1'
        INFOPLIST_KEY_CFBundleDisplayName: Axo
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save chosen photo attachments to your photo library.
        INFOPLIST_KEY_NSCameraUsageDescription: Take photos to attach to prompts. Selected photos upload to your private relay storage.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record voice prompts for on-device transcription. Audio is not uploaded.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  AxoPhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AxoPhoneUITests]
    dependencies:
      - target: AxoPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leostera.axo.phone.uitests
        TEST_TARGET_NAME: AxoPhone
schemes:
  AxoMac:
    build:
      targets:
        AxoMac: all
  AxoPhone:
    build:
      targets:
        AxoPhone: all
    test:
      targets:
        - AxoPhoneUITests
