<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Axo mascot</title>
  <style>
    body { font: 14px -apple-system, system-ui, sans-serif; margin: 24px; background: #f4f4f4; color: #222; }
    @media (prefers-color-scheme: dark) { body { background: #1e1e1e; color: #eee; } }
    .row { display: flex; gap: 24px; align-items: end; flex-wrap: wrap; }
    figure { margin: 0; text-align: center; }
    canvas { display: block; }
    .menubar { background: #e8e8e8; padding: 3px 8px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Axo mascot</h1>
  <p>Each artboard runs the <code>Mascot</code> state machine. Hold the mouse down anywhere and Axo follows it.</p>
  <p>
    <button id="blink">Blink</button>
    <button id="poke">Poke</button>
    <button id="annoyed">Annoyed</button>
    <button id="happy">Happy</button>
    <button id="scream">Scream</button>
    <label><input type="checkbox" id="covering"> Cover eyes</label>
    <label><input type="checkbox" id="loading"> Loading</label>
    <label><input type="checkbox" id="squeezed"> Squeezed</label>
  </p>
  <div class="row">
    <figure><canvas data-artboard="Icon" width="512" height="512" style="width:256px;height:256px"></canvas><figcaption>Icon</figcaption></figure>
    <figure><canvas data-artboard="Face" width="532" height="282" style="width:266px;height:141px"></canvas><figcaption>Face</figcaption></figure>
    <figure><canvas data-artboard="Loader" width="300" height="300" style="width:150px;height:150px"></canvas><figcaption>Loader</figcaption></figure>
    <figure><div class="menubar"><canvas data-artboard="Mark" width="60" height="32" style="width:30px;height:16px"></canvas></div><figcaption>Mark (menu bar size)</figcaption></figure>
  </div>
  <script src="/node_modules/@rive-app/canvas/rive.js"></script>
  <script>
    const { Rive, Layout, Fit, Alignment, RuntimeLoader } = window.rive;
    RuntimeLoader.setWasmUrl("/node_modules/@rive-app/canvas/rive.wasm");
    window.mascots = [];
    window.mascotErrors = [];
    for (const canvas of document.querySelectorAll("canvas[data-artboard]")) {
      const artboard = canvas.dataset.artboard;
      const mascot = new Rive({
        src: "/axo.riv",
        canvas,
        artboard,
        stateMachines: "Mascot",
        autoplay: true,
        layout: new Layout({ fit: Fit.Contain, alignment: Alignment.Center }),
        onLoad: () => { mascot.resizeDrawingSurfaceToCanvas(); mascot.loaded = true; },
        onLoadError: (error) => window.mascotErrors.push(`${artboard}: ${error?.data ?? error}`),
      });
      window.mascots.push(mascot);
    }
    const input = (mascot, name) => mascot.stateMachineInputs("Mascot")?.find((i) => i.name === name);
    const all = (name, apply) => { for (const mascot of window.mascots) { const i = input(mascot, name); if (i) apply(i); } };
    for (const trigger of ["blink", "poke", "annoyed", "happy", "scream"]) {
      document.getElementById(trigger).addEventListener("click", () => all(trigger, (i) => i.fire()));
    }
    for (const name of ["covering", "loading", "squeezed"]) {
      document.getElementById(name).addEventListener("change", (event) => all(name, (i) => (i.value = event.target.checked)));
    }
    // Each mascot looks from its own centre towards the pointer.
    const follow = (event) => {
      for (const mascot of window.mascots) {
        const box = mascot.canvas.getBoundingClientRect();
        const clamp = (v) => Math.max(-100, Math.min(100, v));
        const x = clamp(((event.clientX - (box.left + box.width / 2)) / (window.innerWidth / 2)) * 100);
        const y = clamp(((event.clientY - (box.top + box.height / 2)) / (window.innerHeight / 2)) * 100);
        const lx = input(mascot, "lookX"), ly = input(mascot, "lookY");
        if (lx) lx.value = x;
        if (ly) ly.value = y;
      }
    };
    window.addEventListener("pointerdown", (event) => { if (event.target.closest("button, label")) return; follow(event); all("tracking", (i) => (i.value = true)); });
    window.addEventListener("pointermove", (event) => { if (event.buttons) follow(event); });
    window.addEventListener("pointerup", () => all("tracking", (i) => (i.value = false)));
  </script>
</body>
</html>
